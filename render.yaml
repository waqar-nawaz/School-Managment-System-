# Render Blueprint - School Management System
# One web service: Express API that also serves the built Angular SPA.
# A managed PostgreSQL database is provisioned by Render and wired in through
# DATABASE_URL, so no external database is required.
databases:
  - name: sms-db
    databaseName: school_db
    user: sms
    plan: free
    region: oregon

services:
  - type: web
    name: sms-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: bash render-build.sh
    startCommand: node backend/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_SEEDERS
        value: "true"
      - key: CORS_ORIGIN
        value: http://localhost:4200
      - key: FRONTEND_URL
        value: http://localhost:4200
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # --- Managed PostgreSQL (Render provisions and injects this) ---
      - key: DATABASE_URL
        fromDatabase:
          name: sms-db
          property: connectionString
      - key: DB_DIALECT
        value: postgres
      # --- Optional ---
      - key: REDIS_HOST
        value: ""
        sync: false
      - key: REDIS_PORT
        value: "6379"
        sync: false
      - key: RUN_JOBS
        value: "false"
        sync: false
      - key: SMTP_HOST
        value: ""
        sync: false
      - key: SMTP_PORT
        value: "587"
        sync: false
      - key: SMTP_USER
        value: ""
        sync: false
      - key: SMTP_PASS
        value: ""
        sync: false
      - key: MAIL_FROM
        value: ""
        sync: false
