server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hide nginx version.
  server_tokens off;

  # Security headers — protect against XSS, clickjacking, MIME-sniffing.
  # 'connect-src' allows the same-origin WebSocket /ws/notifications used by the
  # realtime bell — without it the browser would block the upgrade.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; manifest-src 'self'; object-src 'none'; frame-ancestors 'self';" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;
  gzip_vary on;

  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Realtime notifications WebSocket — must be passed through (HTTP/1.1 required).
  location /ws/ {
    proxy_pass http://backend:3000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }

  # Uploaded files (photos, documents) are served by the backend; without this the SPA
  # fallback answered /uploads/... with index.html.
  location /uploads/ {
    proxy_pass http://backend:3000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # PWA manifest — must be served with the correct MIME type or browsers reject it.
  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  # Service worker files must NOT be long-cached, otherwise users never see
  # updates. The Angular worker polls ngsw.json on every navigation, so we let
  # it through with no-cache. Index.html is the same — it references hashed
  # bundles, so it must always be re-fetched to discover new versions.
  location = /ngsw-worker.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /ngsw.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback (after the static rules above)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Angular app bundle — long-cache hashed assets. Excludes the worker
  # files matched above so they're never accidentally long-cached.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
